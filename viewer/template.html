<title>Afterstate 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5b6878;
  --line: #d3dae2;
  --board: #c9d2dc;
  --cell: #dde3ea;
  --accent: #3b4fd4;
  --accent-ink: #ffffff;
  --good: #1f8a5b;
  --t1: #f7f9fb; --t1i: #3a4655;
  --t2: #e3eef0; --t2i: #2f444b;
  --t3: #b9e3da; --t3i: #173b36;
  --t4: #74cbbd; --t4i: #0e302b;
  --t5: #3aa6c9; --t5i: #ffffff;
  --t6: #3b7fd4; --t6i: #ffffff;
  --t7: #4f5bd5; --t7i: #ffffff;
  --t8: #6e48c9; --t8i: #ffffff;
  --t9: #9140b8; --t9i: #ffffff;
  --t10: #b23a9a; --t10i: #ffffff;
  --t11: #d1386f; --t11i: #ffffff;
  --t12: #e5484d; --t12i: #ffffff;
  --t13: #ee6a2e; --t13i: #ffffff;
  --t14: #f29b1d; --t14i: #2a1600;
  --t15: #f5c518; --t15i: #2a1c00;
  --t16: #15151b; --t16i: #f5c518;
  --t17: #15151b; --t17i: #ffe27a;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1217;
    --surface: #161c23;
    --ink: #e4e9ef;
    --muted: #93a0af;
    --line: #28313c;
    --board: #1f2730;
    --cell: #28313c;
    --accent: #8f9bff;
    --accent-ink: #0e1217;
    --good: #4cc58c;
    --t1: #3a4553; --t1i: #d8e0e8;
    --t2: #36505a; --t2i: #d9eef2;
    --t3: #2f6b62; --t3i: #e2f7f2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1217;
  --surface: #161c23;
  --ink: #e4e9ef;
  --muted: #93a0af;
  --line: #28313c;
  --board: #1f2730;
  --cell: #28313c;
  --accent: #8f9bff;
  --accent-ink: #0e1217;
  --good: #4cc58c;
  --t1: #3a4553; --t1i: #d8e0e8;
  --t2: #36505a; --t2i: #d9eef2;
  --t3: #2f6b62; --t3i: #e2f7f2;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 28px 56px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 36px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 850; font-stretch: 112%; letter-spacing: -0.02em; line-height: 1; }
h2 { font-size: 22px; font-weight: 750; font-stretch: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { max-width: 62ch; color: var(--muted); margin: 10px 0 0; font-size: 16px; }
header { display: grid; gap: 22px; }
.keystats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-display); font-size: 30px; font-weight: 800; font-stretch: 90%; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .k { font-size: 13px; color: var(--muted); }

.replay { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .replay { grid-template-columns: minmax(0, 1fr); } }
.boardcol { display: grid; gap: 14px; }
.board {
  position: relative; width: 100%; max-width: 460px; aspect-ratio: 1; background: var(--board);
  border-radius: 12px; padding: 3%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 3%;
}
.cell { background: var(--cell); border-radius: 7px; display: grid; place-items: center; position: relative; container-type: inline-size; }
.tile {
  position: absolute; inset: 0; border-radius: 7px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
}
.tile.new { animation: pop 140ms ease-out; }
.tile.merged { animation: bump 160ms ease-out; }
@keyframes pop { from { transform: scale(0.4); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
@keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.1); } 100% { transform: scale(1); } }
.fast .tile { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .tile { animation: none !important; } }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, canvas:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; min-width: 84px; }
.speed { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.timeline { width: 100%; height: 92px; display: block; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tl-note { font-size: 12.5px; color: var(--muted); }

.side { display: grid; gap: 18px; }
.now { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.now div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.now .k { font-size: 12px; color: var(--muted); }
.now .v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.milestones { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.milestones li { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.chip { font-family: var(--font-display); font-weight: 800; font-size: 13px; border-radius: 5px; padding: 2px 6px; text-align: center; }
.milestones .m { font-family: var(--font-mono); color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.milestones li.future { opacity: 0.45; }
.milestones button { padding: 2px 8px; font-size: 12px; }

.bench { display: grid; gap: 14px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 620px; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td:first-child, th:first-child { text-align: left; }
tr.ours td { font-weight: 700; }
tr:last-child td { border-bottom: none; }
.src { font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.how div { display: grid; gap: 6px; }
.how h3 { font-size: 16px; font-weight: 750; }
.how p { margin: 0; color: var(--muted); font-size: 14px; }
footer { font-size: 12.5px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">2048 · n-tuple networks · expectimax</div>
      <h1>Afterstate</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="keystats" id="keystats"></div>
  </header>

  <section class="replay" aria-label="Game replay">
    <div class="boardcol">
      <div class="board" id="board" aria-live="off"></div>
      <div class="controls">
        <button class="primary" id="play" type="button">Play</button>
        <button id="back" type="button" aria-label="Previous move">◀</button>
        <button id="fwd" type="button" aria-label="Next move">▶</button>
        <label class="speed" for="speed">Speed
          <select id="speed">
            <option value="4">4 moves/s</option>
            <option value="15">15 moves/s</option>
            <option value="60" selected>60 moves/s</option>
            <option value="250">250 moves/s</option>
            <option value="1500">1500 moves/s</option>
          </select>
        </label>
      </div>
      <canvas class="timeline" id="timeline" tabindex="0" aria-label="Game timeline: click to jump to a move"></canvas>
      <div class="tl-note">Score over the game. Markers show when each new largest tile first appeared. Click or drag to jump.</div>
    </div>
    <div class="side">
      <div style="display:grid; gap:8px">
        <label class="eyebrow" for="game">Recorded game</label>
        <select id="game"></select>
      </div>
      <div class="now">
        <div><div class="k">Score</div><div class="v" id="score">0</div></div>
        <div><div class="k">Move</div><div class="v" id="move">0</div></div>
        <div><div class="k">Largest tile</div><div class="v" id="maxtile">2</div></div>
      </div>
      <div>
        <h2 style="font-size:17px; margin-bottom:6px">Milestones</h2>
        <ul class="milestones" id="milestones"></ul>
      </div>
    </div>
  </section>

  <section class="bench" aria-label="Benchmark">
    <h2>How often it gets there</h2>
    <div class="tablewrap"><table id="benchtable"></table></div>
    <p class="src" id="benchnote"></p>
  </section>

  <section class="how" aria-label="Method">
    <div><h3>Value function</h3><p id="how1"></p></div>
    <div><h3>Training</h3><p id="how2"></p></div>
    <div><h3>Search</h3><p id="how3"></p></div>
  </section>
  <footer id="footer"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString('en-US');
  const DIR = { U: 0, R: 1, D: 2, L: 3 };

  // ---- text ----
  $('lede').textContent = DATA.lede;
  $('how1').textContent = DATA.how[0];
  $('how2').textContent = DATA.how[1];
  $('how3').textContent = DATA.how[2];
  $('footer').textContent = DATA.footer;
  $('keystats').innerHTML = DATA.keystats.map(s => `<div class="stat"><div class="v">${s.v}</div><div class="k">${s.k}</div></div>`).join('');

  // ---- benchmark table ----
  const bt = DATA.bench;
  let th = '<thead><tr><th>Player</th><th>Games</th><th>Mean score</th>' + bt.tiles.map(t => `<th>${fmt(t)}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of bt.rows) {
    th += `<tr class="${r.ours ? 'ours' : ''}"><td>${r.name}</td><td>${r.games}</td><td>${r.mean}</td>` + r.rates.map(x => `<td>${x}</td>`).join('') + '</tr>';
  }
  $('benchtable').innerHTML = th + '</tbody>';
  $('benchnote').textContent = bt.note;

  // ---- game engine (mirrors the C++ rules) ----
  function slideLine(vals) {
    const t = vals.filter(v => v);
    const out = []; let gained = 0; const merged = [];
    for (let i = 0; i < t.length; i++) {
      if (i + 1 < t.length && t[i] === t[i + 1]) { out.push(t[i] + 1); merged.push(out.length - 1); gained += 2 ** (t[i] + 1); i++; }
      else out.push(t[i]);
    }
    while (out.length < 4) out.push(0);
    return { out, gained, merged };
  }
  function lineCells(dir, k) {
    const cells = [];
    for (let j = 0; j < 4; j++) {
      let r, c;
      if (dir === 0) { r = j; c = k; } else if (dir === 2) { r = 3 - j; c = k; }
      else if (dir === 3) { r = k; c = j; } else { r = k; c = 3 - j; }
      cells.push(r * 4 + c);
    }
    return cells;
  }
  function applyMove(b, dir) {
    const nb = b.slice(); let gained = 0; const mergedCells = [];
    for (let k = 0; k < 4; k++) {
      const cells = lineCells(dir, k);
      const res = slideLine(cells.map(i => b[i]));
      cells.forEach((ci, j) => { nb[ci] = res.out[j]; });
      res.merged.forEach(j => mergedCells.push(cells[j]));
      gained += res.gained;
    }
    return { nb, gained, mergedCells };
  }

  // ---- games ----
  const B32 = '0123456789abcdefghijklmnopqrstuv';
  const games = DATA.games.map(g => {
    const init = [...g.init].map(ch => B32.indexOf(ch));
    const n = g.moves.length / 3;
    const scores = new Float64Array(n + 1), maxr = new Uint8Array(n + 1);
    const snaps = [];
    let b = init.slice(), score = 0, mx = Math.max(...b);
    const firsts = {};
    maxr[0] = mx;
    for (let i = 0; i < n; i++) {
      if (i % 256 === 0) snaps.push({ b: b.slice(), score });
      const d = DIR[g.moves[i * 3]], cell = parseInt(g.moves[i * 3 + 1], 16), v = g.moves[i * 3 + 2] === '2' ? 1 : 2;
      const r = applyMove(b, d);
      b = r.nb; b[cell] = v; score += r.gained;
      const m = Math.max(...b);
      if (m > mx) { mx = m; if (m >= 11) firsts[m] = i + 1; }
      scores[i + 1] = score; maxr[i + 1] = mx;
    }
    return { ...g, init, n, scores, maxr, snaps, firsts, final: score };
  });
  const sel = $('game');
  games.forEach((g, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = `${g.label} · ${fmt(g.final)} points · largest tile ${fmt(2 ** g.maxr[g.n])}`;
    sel.appendChild(o);
  });

  // ---- board rendering ----
  const boardEl = $('board');
  const cells = [];
  for (let i = 0; i < 16; i++) { const c = document.createElement('div'); c.className = 'cell'; boardEl.appendChild(c); cells.push(c); }
  function tileStyle(v) {
    const k = Math.min(v, 17);
    const digits = String(2 ** v).length;
    const size = [0, 44, 44, 40, 34, 29, 25][Math.min(digits, 6)];
    const width = [0, 100, 100, 92, 80, 70, 62][Math.min(digits, 6)];
    return `background:var(--t${k});color:var(--t${k}i);font-size:${size}cqi;font-stretch:${width}%`;
  }
  let shown = new Array(16).fill(-1);
  function render(b, newCell, mergedCells) {
    for (let i = 0; i < 16; i++) {
      const v = b[i];
      const cls = i === newCell ? 'tile new' : (mergedCells && mergedCells.includes(i) ? 'tile merged' : 'tile');
      if (v === shown[i] && cls === 'tile') continue;
      cells[i].innerHTML = v ? `<div class="${cls}" style="${tileStyle(v)}">${fmt(2 ** v)}</div>` : '';
      shown[i] = v;
    }
  }

  // ---- state ----
  let G = games[0], pos = 0, board = G.init.slice(), score = 0;
  function seek(target) {
    target = Math.max(0, Math.min(G.n, target | 0));
    const s = G.snaps[Math.floor(target / 256)] || { b: G.init, score: 0 };
    let b = s.b.slice(), sc = s.score, p = Math.floor(target / 256) * 256;
    let last = null;
    for (; p < target; p++) {
      const d = DIR[G.moves[p * 3]], cell = parseInt(G.moves[p * 3 + 1], 16), v = G.moves[p * 3 + 2] === '2' ? 1 : 2;
      const r = applyMove(b, d); b = r.nb; b[cell] = v; sc += r.gained; last = { cell, merged: r.mergedCells };
    }
    board = b; score = sc; pos = target;
    const isStep = last && Math.abs(target - pos) <= 1;
    render(board, last && playing ? last.cell : -1, last && playing ? last.merged : null);
    updateInfo();
  }
  function updateInfo() {
    $('score').textContent = fmt(score);
    $('move').textContent = fmt(pos);
    $('maxtile').textContent = fmt(2 ** G.maxr[pos]);
    drawTimeline();
    renderMilestones();
  }
  function renderMilestones() {
    const ul = $('milestones');
    const ranks = Object.keys(G.firsts).map(Number).sort((a, b) => a - b);
    ul.innerHTML = ranks.map(r => {
      const at = G.firsts[r];
      return `<li class="${at > pos ? 'future' : ''}"><span class="chip" style="background:var(--t${Math.min(r, 17)});color:var(--t${Math.min(r, 17)}i)">${fmt(2 ** r)}</span>` +
        `<span class="m">move ${fmt(at)} · score ${fmt(G.scores[at])}</span><button type="button" data-seek="${at}">Jump</button></li>`;
    }).join('');
  }
  $('milestones').addEventListener('click', (e) => {
    const t = e.target.closest('button[data-seek]');
    if (t) { stop(); seek(Number(t.dataset.seek) - 1); }
  });

  // ---- timeline ----
  const tl = $('timeline');
  function drawTimeline() {
    const dpr = window.devicePixelRatio || 1;
    const w = tl.clientWidth, h = tl.clientHeight;
    if (tl.width !== Math.round(w * dpr)) { tl.width = Math.round(w * dpr); tl.height = Math.round(h * dpr); }
    const ctx = tl.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement);
    const accent = cs.getPropertyValue('--accent').trim(), line = cs.getPropertyValue('--line').trim(), muted = cs.getPropertyValue('--muted').trim();
    const padL = 8, padR = 8, padT = 10, padB = 16;
    const W = w - padL - padR, H = h - padT - padB, maxS = G.final || 1;
    const x = (i) => padL + (i / G.n) * W, y = (s) => padT + H - (s / maxS) * H;
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, padT + H + 0.5); ctx.lineTo(padL + W, padT + H + 0.5); ctx.stroke();
    ctx.beginPath();
    const step = Math.max(1, Math.floor(G.n / W));
    ctx.moveTo(x(0), y(0));
    for (let i = 0; i <= G.n; i += step) ctx.lineTo(x(i), y(G.scores[i]));
    ctx.lineTo(x(G.n), y(G.final)); ctx.lineTo(x(G.n), padT + H); ctx.lineTo(x(0), padT + H); ctx.closePath();
    ctx.globalAlpha = 0.16; ctx.fillStyle = accent; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.moveTo(x(0), y(0));
    for (let i = 0; i <= G.n; i += step) ctx.lineTo(x(i), y(G.scores[i]));
    ctx.lineTo(x(G.n), y(G.final));
    ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.stroke();
    for (const r of Object.keys(G.firsts).map(Number)) {
      const at = G.firsts[r], px = x(at);
      ctx.fillStyle = cs.getPropertyValue(`--t${Math.min(r, 17)}`).trim();
      ctx.fillRect(px - 1, padT, 2, H);
    }
    ctx.fillStyle = muted; ctx.font = '11px ' + cs.getPropertyValue('--font-mono');
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('move 0', padL, h - 3);
    const endLabel = 'move ' + fmt(G.n);
    ctx.fillText(endLabel, padL + W - ctx.measureText(endLabel).width, h - 3);
    const cx = x(pos);
    ctx.fillStyle = cs.getPropertyValue('--ink').trim();
    ctx.fillRect(cx - 1, padT - 4, 2, H + 4);
    ctx.beginPath(); ctx.arc(cx, y(G.scores[pos]), 4, 0, Math.PI * 2); ctx.fill();
  }
  let dragging = false;
  const seekFromEvent = (e) => {
    const r = tl.getBoundingClientRect();
    const f = (e.clientX - r.left - 8) / (r.width - 16);
    seek(Math.round(Math.max(0, Math.min(1, f)) * G.n));
  };
  tl.addEventListener('pointerdown', (e) => { stop(); dragging = true; tl.setPointerCapture(e.pointerId); seekFromEvent(e); });
  tl.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
  tl.addEventListener('pointerup', () => { dragging = false; });
  tl.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { stop(); seek(pos + (e.shiftKey ? 100 : 1)); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { stop(); seek(pos - (e.shiftKey ? 100 : 1)); e.preventDefault(); }
  });
  window.addEventListener('resize', drawTimeline);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', drawTimeline);
  new MutationObserver(drawTimeline).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---- playback ----
  let playing = false, raf = 0, lastT = 0, acc = 0;
  function frame(t) {
    if (!playing) return;
    const rate = Number($('speed').value);
    acc += Math.min(0.25, (t - lastT) / 1000) * rate; lastT = t;
    const k = Math.floor(acc);
    if (k > 0) {
      acc -= k;
      boardEl.classList.toggle('fast', rate > 60);
      seek(pos + k);
      if (pos >= G.n) { stop(); return; }
    }
    raf = requestAnimationFrame(frame);
  }
  function start() {
    if (pos >= G.n) seek(0);
    playing = true; $('play').textContent = 'Pause'; lastT = performance.now(); acc = 0; raf = requestAnimationFrame(frame);
  }
  function stop() { playing = false; $('play').textContent = 'Play'; cancelAnimationFrame(raf); }
  $('play').addEventListener('click', () => (playing ? stop() : start()));
  $('fwd').addEventListener('click', () => { stop(); seek(pos + 1); });
  $('back').addEventListener('click', () => { stop(); seek(pos - 1); });
  sel.addEventListener('change', () => { stop(); G = games[Number(sel.value)]; shown.fill(-1); seek(DATA.startAt ? Math.floor(G.n * DATA.startAt) : 0); });

  // open on an interesting moment: the position just before the largest tile formed
  const topRank = Math.max(...Object.keys(G.firsts).map(Number));
  seek(G.firsts[topRank] ? G.firsts[topRank] - 1 : 0);
})();
</script>
