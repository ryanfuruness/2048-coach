<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; }
body { width: 512px; height: 512px; background: #d9a514; display: grid; place-items: center; }
.mark { width: 360px; height: 360px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.mark i { border-radius: 30px; background: rgba(255,255,255,.88); } .mark i:nth-child(2), .mark i:nth-child(3) { background: rgba(255,255,255,.5); } .mark i:nth-child(4) { background: #3b2a05; }
</style></head><body><div class="mark"><i></i><i></i><i></i><i></i></div></body></html>
