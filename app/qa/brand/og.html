<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Inter; src: url('../../web/public/fonts/inter-latin-wght-v1.woff2') format('woff2-variations'); font-weight: 100 900; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #f6f5f1; font-family: Inter, sans-serif; color: #161513; display: flex; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box; }
.text { flex: 1; }
.brand { display: flex; align-items: center; gap: 18px; font-size: 64px; font-weight: 750; letter-spacing: -0.03em; }
.brand b { color: #1c5cab; font-weight: 800; }
.mark { width: 72px; height: 72px; border-radius: 18px; background: #d9a514; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding: 10px; box-sizing: border-box; }
.mark i { border-radius: 6px; background: rgba(255,255,255,.88); } .mark i:nth-child(2), .mark i:nth-child(3) { background: rgba(255,255,255,.5); } .mark i:nth-child(4) { background: #3b2a05; }
.tag { margin-top: 28px; font-size: 34px; line-height: 1.3; color: #52514e; letter-spacing: -0.01em; }
.grades { margin-top: 30px; display: flex; gap: 10px; }
.g { font-size: 22px; font-weight: 650; padding: 4px 14px; border-radius: 999px; }
.best { background: #e1f3e1; color: #006300; } .good { background: #e2ecf8; color: #1c5cab; } .q { background: #fdf1d6; color: #6b4a00; } .bl { background: #f9e2e2; color: #a82626; }
.foot { margin-top: 34px; font-size: 24px; color: #6f6d68; }
.board { width: 400px; height: 400px; background: #d6cfc3; border-radius: 16px; padding: 12px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; }
.c { border-radius: 9px; background: #e7e1d7; display: grid; place-items: center; font-weight: 800; letter-spacing: -0.03em; font-size: 30px; color: #3b2a05; }
.v2 { background: #efe8dd; color: #5b5045; font-size: 40px; } .v4 { background: #ece0c8; color: #5b5045; font-size: 40px; }
.v8 { background: #f4b17a; color: #3b2208; font-size: 40px; } .v32 { background: #e8643f; color: #fff; font-size: 40px; } .v64 { background: #d74b35; color: #fff; font-size: 40px; }
.v128 { background: #edcf6a; } .v256 { background: #e8c54c; } .v512 { background: #e4bb2f; } .v1024 { background: #dfb01a; font-size: 26px; } .v2048 { background: #d9a514; font-size: 26px; }
</style></head><body>
<div class="text">
  <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span><span>2048 <b>Coach</b></span></div>
  <div class="tag">Play 2048 with a strong engine beside you.<br>It grades every move you make.</div>
  <div class="grades"><span class="g best">Best</span><span class="g good">Good</span><span class="g q">Questionable</span><span class="g bl">Blunder</span></div>
  <div class="foot">Free · no sign-up · 2048coach.com</div>
</div>
<div class="board">
  <div class="c v2048">2048</div><div class="c v1024">1024</div><div class="c v512">512</div><div class="c v256">256</div>
  <div class="c v8">8</div><div class="c v32">32</div><div class="c v64">64</div><div class="c v128">128</div>
  <div class="c v2">2</div><div class="c v4">4</div><div class="c v2">2</div><div class="c"></div>
  <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
</div>
</body></html>
